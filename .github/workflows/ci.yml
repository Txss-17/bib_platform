name: BIB Platform - CI

on:
  push:
    branches:
      - main
      - master
      - 'codex/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bib-platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-integration:
    name: Merchant supply cross-app integration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Platform
        uses: actions/checkout@v7
        with:
          path: bib_platform
      - name: Checkout compatible Intranet
        uses: actions/checkout@v7
        with:
          repository: Txss-17/bib_intranet
          ref: main
          path: bib_intranet
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bib_platform/package-lock.json
      - name: Install Platform dependencies
        working-directory: bib_platform
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Test both database flows without remote services
        working-directory: bib_platform
        run: npm run test:supply:integration
      - name: Verify paired Edge contracts
        working-directory: bib_platform
        run: npm run check:bridge

  privacy-browser:
    name: Cookie consent browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Platform
        uses: actions/checkout@v7
        with:
          path: bib_platform
      - name: Checkout compatible Intranet
        uses: actions/checkout@v7
        with:
          repository: Txss-17/bib_intranet
          ref: main
          path: bib_intranet
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bib_platform/package-lock.json
      - name: Install Platform dependencies
        working-directory: bib_platform
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Install Intranet dependencies
        working-directory: bib_intranet
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: bib_platform
        run: npx playwright install --with-deps chromium
      - name: Verify cookie requests, withdrawal, routes and mobile layouts
        working-directory: bib_platform
        env:
          BIB_INTRABIB_ROOT: ../bib_intranet
          BIB_PRIVACY_ARTIFACTS: ${{ runner.temp }}/bib-cookie-smoke
        run: npm run test:privacy:browser
      - name: Verify supplier quotes, explicit agreement, private access and mobile layouts
        working-directory: bib_platform
        env:
          BIB_SUPPLY_ARTIFACTS: ${{ runner.temp }}/bib-supply-smoke
        run: npm run test:supply:browser
      - name: Upload mobile supplier quote screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supplier-quote-screenshots
          path: ${{ runner.temp }}/bib-supply-smoke
          if-no-files-found: ignore
      - name: Upload mobile cookie screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cookie-consent-screenshots
          path: ${{ runner.temp }}/bib-cookie-smoke
          if-no-files-found: ignore

  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Test acquisition agreements, owner-only payments and financial evidence
        run: npm run test:supply

      - name: Typecheck supply, storefront and webhook boundaries
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --lib ES2022,DOM,DOM.Iterable --skipLibCheck --strictNullChecks --noImplicitAny false --allowImportingTsExtensions tests/supplier-audit/edge-env.d.ts tests/supply/edge-env.d.ts supabase/functions/merchant-supply/index.ts supabase/functions/merchant-supply-sync/index.ts supabase/functions/create-sample-checkout/index.ts supabase/functions/create-storefront-checkout/index.ts supabase/functions/create-pos-checkout/index.ts supabase/functions/payments-webhook/index.ts supabase/functions/refund-order-issue/index.ts

      - name: Test cookie choices, optional tracking and external media blocking
        run: npm run test:privacy

      - name: Test scoped email consent, confirmed audience and withdrawal
        run: npm run test:marketing

      - name: Typecheck subscription and marketing delivery endpoints
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --lib ES2022,DOM --skipLibCheck --strictNullChecks --noImplicitAny false --allowImportingTsExtensions tests/supplier-audit/edge-env.d.ts tests/marketing/edge-env.d.ts supabase/functions/marketing-subscription/index.ts supabase/functions/send-marketing-campaign/index.ts

      - name: Test supplier audit portal authorization and version contract
        run: npm run test:supplier-audit

      - name: Test legal document assembly and immutable order evidence
        run: npm run test:legal-governance

      - name: Typecheck private legal governance import
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --lib ES2022,DOM --skipLibCheck --strictNullChecks --noImplicitAny false --allowImportingTsExtensions tests/supplier-audit/edge-env.d.ts supabase/functions/legal-governance-import/index.ts

      - name: Typecheck partner audit authorization boundary
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --lib ES2022,DOM --skipLibCheck --strictNullChecks --noImplicitAny false --allowImportingTsExtensions tests/supplier-audit/edge-env.d.ts supabase/functions/partner-portal-action/index.ts

      - name: Validate TypeScript
        run: npm run check

      - name: Build application
        run: npm run build

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test -- --run --passWithNoTests

      - name: Test insured SAV with real PostgreSQL functions
        run: npx vitest run --config tests/sav/vitest.config.ts

  bridge:
    name: Platform and Intranet contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Platform
        uses: actions/checkout@v7
        with:
          path: bib_platform
      - name: Checkout compatible Intranet
        uses: actions/checkout@v7
        with:
          repository: Txss-17/bib_intranet
          ref: main
          path: bib_intranet
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bib_platform/package-lock.json
      - name: Install Platform dependencies
        working-directory: bib_platform
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Test bridge contracts and database rules
        working-directory: bib_platform
        run: npm run test:bridge
      - name: Check bridge types
        working-directory: bib_platform
        run: npm run check:bridge
