name: BIB Platform - CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bib-platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test -- --run --passWithNoTests

      - name: Build application
        run: npm run build

  bridge:
    name: Platform and Intranet contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Platform
        uses: actions/checkout@v4
        with:
          path: bib_platform
      - name: Checkout compatible Intranet
        uses: actions/checkout@v4
        with:
          repository: Txss-17/bib_intranet
          ref: 9e7a962c6b0dcc5ba0a80f52f4fbed2dad30c2fb
          path: bib_intranet
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bib_platform/package-lock.json
      - name: Install Platform dependencies
        working-directory: bib_platform
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Test bridge contracts and database rules
        working-directory: bib_platform
        run: npm run test:bridge
      - name: Check bridge types
        working-directory: bib_platform
        run: npm run check:bridge
