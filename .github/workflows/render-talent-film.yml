name: BIB Talent — Render product explainer

on:
  push:
    branches:
      - codex/talent-real-bib-product-film-20261030
    paths:
      - scripts/build_talent_film.py
      - .github/workflows/render-talent-film.yml
      - src/assets/landing-dashboard.jpg
      - src/assets/landing-unboxing.jpg
      - src/assets/landing-partener.jpg

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install render tools
        run: |
          python -m pip install "Pillow>=10,<13"
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Render project film from BIB brand assets
        run: python scripts/build_talent_film.py
      - name: Verify playable MP4 and duration
        run: |
          set -euo pipefail
          test -s src/assets/bib-project-talent.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration -of json src/assets/bib-project-talent.mp4
          test "$(stat -c%s src/assets/bib-project-talent.mp4)" -lt 18000000
      - name: Commit generated original video to source branch
        run: |
          set -euo pipefail
          git config user.name "bib-video-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/bib-project-talent.mp4
          if git diff --cached --quiet; then
            echo "Film already matches the generation script."
          else
            git commit -m "media(talent): add real BIB product explainer MP4"
            git push origin HEAD:refs/heads/codex/talent-real-bib-product-film-20261030
          fi
