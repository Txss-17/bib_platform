name: BIB Codex

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Instruction à donner à Codex"
        required: true
        type: string

permissions:
  contents: read

jobs:
  codex:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.MY_BIB_KEY }}
          permission-profile: ":read-only"
          prompt: |
            Tu travailles sur le dépôt Brand-in-a-box (BIB).

            Instruction de l'utilisateur :
            ${{ inputs.prompt }}

            Règles pour ce test :
            - Analyse le dépôt avant de répondre.
            - Ne modifie aucun fichier.
            - Ne crée aucun fichier.
            - Ne crée aucun commit.
            - Ne crée aucune branche.
            - Ne crée aucune Pull Request.
            - Ne modifie aucune configuration GitHub.
            - Ne modifie aucun secret.
            - Retourne un résumé clair de ton analyse.
